name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for docker emulation)
        uses: docker/setup-qemu-action@v2

      - name: Show Docker version
        run: docker version

      - name: Build APK with Buildozer (Docker)
        env:
          HOME: /github/home
        run: |
          # Run Buildozer inside the official Kivy Buildozer image (latest).
          # Mount repository and run buildozer in android/ directory.
          docker run --rm -v "${{ github.workspace }}":/home/user/hostproject -w /home/user/hostproject/android kivy/buildozer:latest /bin/bash -lc "\
            pip install --upgrade buildozer && \
            # Auto-confirm the root warning prompt and run buildozer
            yes y | buildozer -v android debug \
          "

      - name: List build output (for debugging)
        run: |
          echo "Repository root content:"
          ls -la "${{ github.workspace }}"
          echo "android/ content:"
          ls -la "${{ github.workspace }}/android" || true
          echo "android/bin content (expected APKs):"
          ls -la "${{ github.workspace }}/android/bin" || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/bin
